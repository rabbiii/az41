<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2390" viewBox="0 0 1600 2390"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="1600" height="2390" fill="#F8FAFC"/>
<rect x="0" y="0" width="1600" height="2390" rx="0" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="1.5"/>
<text x="60" y="80" font-family="Arial" font-size="38" font-weight="bold" fill="#0F172A">Step 5 | Inside precipitate insertion</text>
<text x="60" y="122" font-family="Arial" font-size="21" font-weight="normal" fill="#475569">How the alloyed polycrystal, grain orientations and beta crystal structure become one extended CFG.</text>
<rect x="60" y="170" width="470" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="82" y="207" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">MATRIX INPUT</text>
<text x="82" y="252" font-family="Arial" font-size="22" font-weight="bold" fill="#0F172A">az41poly_alloy2.cfg</text>
<text x="82" y="296" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">cfg_utils.py reads the box, atom species,</text>
<text x="82" y="324" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">Cartesian positions and grain IDs.</text>
<text x="82" y="352" font-family="Arial" font-size="19" font-weight="normal" fill="#334155"></text>
<text x="82" y="380" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">Inherited from the alloying stage.</text>
<text x="82" y="408" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">The grainID field links atoms to host grains.</text>
<rect x="565" y="170" width="470" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="587" y="207" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">GRAIN GEOMETRY INPUT</text>
<text x="587" y="252" font-family="Arial" font-size="22" font-weight="bold" fill="#0F172A">az41poly_param.txt</text>
<text x="587" y="296" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">orientation.py reads grain nodes and angles.</text>
<text x="587" y="324" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">It constructs each host-grain rotation.</text>
<text x="587" y="352" font-family="Arial" font-size="19" font-weight="normal" fill="#334155"></text>
<text x="587" y="380" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">Use the generated file with explicit nodes,</text>
<text x="587" y="408" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">not the initial random-grain request.</text>
<rect x="1070" y="170" width="470" height="260" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1092" y="207" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">PRECIPITATE CRYSTAL INPUT</text>
<text x="1092" y="252" font-family="Arial" font-size="22" font-weight="bold" fill="#0F172A">1576218-Mg17Al12.cif</text>
<text x="1092" y="296" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">cif_utils.py expands the symmetry sites</text>
<text x="1092" y="324" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">into the beta conventional unit cell.</text>
<text x="1092" y="352" font-family="Arial" font-size="19" font-weight="normal" fill="#334155"></text>
<text x="1092" y="380" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">58 atoms: Mg34Al24; cubic lattice</text>
<text x="1092" y="408" font-family="Arial" font-size="19" font-weight="normal" fill="#334155">parameter a = 10.5438 Å.</text>
<path d="M295,430 L295,450" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,430 L800,450" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1305,430 L1305,450" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="460" width="1480" height="65" rx="12" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="82" y="499" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">insert_precipitates.py   |   Python + NumPy + SciPy   |   input paths and OUT_PATH configured before execution</text>
<path d="M620,525 L620,565" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="575" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="597" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="625" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5A</text>
<text x="158" y="627" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Load the matrix, crystallography and rotations</text>
<text x="84" y="677" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Read the three inputs. Build the beta cell and the Burgers orientation rotation R_OR.</text>
<text x="84" y="706" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Internal result: matrix arrays, a grain-rotation lookup and a reusable beta unit cell.</text>
<rect x="1150" y="575" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="610" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">ORIENTATION CONVENTION</text>
<text x="1172" y="649" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">R_grain = Rz × Ry × Rx</text>
<text x="1172" y="676" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">R_lab = R_grain × R_OR</text>
<text x="1172" y="703" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">The helper assumes this rotation order.</text>
<text x="1172" y="730" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">OR aligns each cube to its host grain.</text>
<path d="M570,745 L570,775" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="785" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="807" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="835" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5B</text>
<text x="158" y="837" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Detect atoms at grain boundaries</text>
<text x="84" y="887" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Use a periodic cKDTree to find atom pairs within 3.6 Å.</text>
<text x="84" y="916" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Flag atoms in pairs whose grain IDs differ. Internal result: GB positions and host IDs.</text>
<rect x="1150" y="785" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="820" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">WHY GRAIN IDS MATTER</text>
<text x="1172" y="859" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Different neighboring grain IDs</text>
<text x="1172" y="886" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">identify boundary atoms directly.</text>
<text x="1172" y="913" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">The script does not infer grains</text>
<text x="1172" y="940" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">from a later structural analysis.</text>
<path d="M570,955 L570,985" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="995" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="1017" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="1045" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5C</text>
<text x="158" y="1047" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Select well-separated nucleation sites</text>
<text x="84" y="1097" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Shuffle the GB candidates using seed 7; accept centers more than 56 Å apart.</text>
<text x="84" y="1126" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Target count = round(0.10 × box volume / 35³) = 19; fewer sites may be accepted.</text>
<rect x="1150" y="995" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="1030" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">INTERNAL OUTPUT</text>
<text x="1172" y="1069" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Chosen centers + host-grain IDs.</text>
<text x="1172" y="1096" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Periodic minimum-image distances</text>
<text x="1172" y="1123" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">keep selected centers apart.</text>
<text x="1172" y="1150" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">10% is a nominal geometric target.</text>
<path d="M570,1165 L570,1195" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="1205" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="1227" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="1255" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5D</text>
<text x="158" y="1257" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Build and orient each beta precipitate</text>
<text x="84" y="1307" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Repeat the Mg17Al12 unit cell and crop a 35 Å cube in its own crystal axes.</text>
<text x="84" y="1336" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Rotate with R_lab and translate to the selected GB center. Result: oriented beta atoms.</text>
<rect x="1150" y="1205" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="1240" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">MORPHOLOGY / SCALE</text>
<text x="1172" y="1279" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Block-shaped beta precipitates.</text>
<text x="1172" y="1306" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">35 Å = 3.5 nm cube edge.</text>
<text x="1172" y="1333" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">This is the script&apos;s scaled model size,</text>
<text x="1172" y="1360" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">not a measured experimental size.</text>
<path d="M570,1375 L570,1405" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="1415" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="1437" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="1465" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5E</text>
<text x="158" y="1467" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Replace matrix regions and merge the atom sets</text>
<text x="84" y="1517" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Remove matrix atoms inside each rotated cube plus a 2.5 Å buffer.</text>
<text x="84" y="1546" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Append the beta atoms; assign precipitate grain IDs 101, 102, … and merge the arrays.</text>
<rect x="1150" y="1415" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="1450" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">INTERNAL OUTPUT</text>
<text x="1172" y="1489" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Combined species and coordinates.</text>
<text x="1172" y="1516" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Matrix grain IDs are retained;</text>
<text x="1172" y="1543" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">new IDs distinguish precipitates.</text>
<text x="1172" y="1570" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Atom count changes during insertion.</text>
<path d="M570,1585 L570,1615" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="1625" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="1647" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="1675" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5F</text>
<text x="158" y="1677" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Wrap into the box and clean close contacts</text>
<text x="84" y="1727" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Wrap fractional coordinates into [0, 1). Search periodic pairs closer than 1.6 Å.</text>
<text x="84" y="1756" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Remove conflicting matrix atoms, favoring beta atoms; beta–beta pairs are left intact.</text>
<rect x="1150" y="1625" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="1660" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">PERIODIC CLEANUP</text>
<text x="1172" y="1699" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">The merged structure stays inside</text>
<text x="1172" y="1726" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">the original periodic box.</text>
<text x="1172" y="1753" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Cleanup removes close matrix contacts;</text>
<text x="1172" y="1780" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">it is a geometric operation.</text>
<path d="M570,1795 L570,1825" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="1835" width="1020" height="170" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
<rect x="82" y="1857" width="58" height="42" rx="8" fill="#6D28D9" stroke="#6D28D9" stroke-width="1.5"/>
<text x="94" y="1885" font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">5G</text>
<text x="158" y="1887" font-family="Arial" font-size="24" font-weight="bold" fill="#0F172A">Apply the local Al-depletion approximation</text>
<text x="84" y="1937" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Compare final Al count with the input Al count. Rank matrix Al by proximity to precipitates.</text>
<text x="84" y="1966" font-family="Arial" font-size="20" font-weight="normal" fill="#334155">Convert nearby excess matrix Al back to Mg, limited by the number of matrix Al atoms.</text>
<rect x="1150" y="1835" width="390" height="182" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1172" y="1870" font-family="Arial" font-size="15" font-weight="bold" fill="#64748B">COMPOSITION LIMIT</text>
<text x="1172" y="1909" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">The correction targets the initial</text>
<text x="1172" y="1936" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">Al atom count. The total atom count</text>
<text x="1172" y="1963" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">changes, and matrix Al can run out;</text>
<text x="1172" y="1990" font-family="Arial" font-size="18" font-weight="normal" fill="#334155">exact composition is not guaranteed.</text>
<path d="M570,2005 L570,2050" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="2060" width="1480" height="210" rx="18" fill="#065F46" stroke="#065F46" stroke-width="1.5"/>
<text x="88" y="2101" font-family="Arial" font-size="16" font-weight="bold" fill="#A7F3D0">LAST OPERATION  /  WRITE THE FINAL EXTENDED CFG</text>
<text x="88" y="2158" font-family="Arial" font-size="32" font-weight="bold" fill="#FFFFFF">az41poly_with_precipitates.cfg</text>
<text x="88" y="2201" font-family="Arial" font-size="21" font-weight="normal" fill="#ECFDF5">cfg_utils.write_extended_cfg writes the box, chemical species, wrapped coordinates and grain IDs.</text>
<text x="88" y="2234" font-family="Arial" font-size="21" font-weight="normal" fill="#ECFDF5">The existing project example contains 339,897 atoms. This file is the endpoint of the requested workflow.</text>
<text x="60" y="2331" font-family="Arial" font-size="16" font-weight="normal" fill="#64748B">File inputs are shown by basename. The driver and helper modules are in the project&apos;s files from claude folder.  |  02 / 02</text>
</svg>